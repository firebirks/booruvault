<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>WebRTC probe</title></head><body>
<!--
  Looks for RTCPeerConnection wherever a page can reach a new frame, and tries each one it finds:
  a host candidate, gathered with no server at all, proves a peer connection works there. With a
  STUN server it would tell the server the phone's own address, around any proxy. Each finding is
  one line, "PROBE <name> <result>", and the last two say what was found:
  "PROBE SUMMARY leaks <names|none>" and "PROBE SUMMARY natives <ok|NOT ...>".
-->
<script>
var leaks = [];
var unnatural = [];
function report(name, value) { console.log('PROBE ' + name + ' ' + value); }
function check(name, w) {
  var t;
  try { t = typeof w.RTCPeerConnection; } catch (e) { report(name, 'error:' + e.name); return; }
  report(name, t);
  if (t !== 'function') return;
  try {
    var pc = new w.RTCPeerConnection({ iceServers: [] });
    pc.createDataChannel('probe');
    pc.onicecandidate = function (e) {
      if (e.candidate && leaks.indexOf(name) < 0) { leaks.push(name); report(name + '.LEAK', e.candidate.candidate.split(' ').slice(4, 8).join(' ')); }
    };
    pc.createOffer().then(function (o) { return pc.setLocalDescription(o); });
  } catch (e) { report(name + '.construct', 'error:' + e.name); }
}
window.addEventListener('message', function (e) { report('msg', e.data); });
check('top', window);
</script>

<!-- A frame the parser makes, and a script right after it. -->
<iframe></iframe>
<script>check('parser', frames[0]);</script>
<script>document.write('<iframe></iframe>');</script>
<script>check('document.write', frames[frames.length - 1]);</script>

<script>
// Frames made by script, looked into at once, through the index and through the element.
var f1 = document.createElement('iframe');
document.body.appendChild(f1);
check('appendChild', frames[frames.length - 1]);
check('contentWindow', f1.contentWindow);

var holder = document.createElement('div');
document.body.appendChild(holder);
holder.innerHTML = '<iframe></iframe>';
check('innerHTML', frames[frames.length - 1]);

document.body.insertAdjacentHTML('beforeend', '<iframe></iframe>');
check('insertAdjacentHTML', frames[frames.length - 1]);

var host = document.createElement('div');
document.body.appendChild(host);
host.attachShadow({ mode: 'open' }).innerHTML = '<iframe></iframe>';
check('shadowRoot', frames[frames.length - 1]);

try {
  var inner = f1.contentDocument.createElement('iframe');
  f1.contentDocument.body.appendChild(inner);
  check('nested', f1.contentWindow[0]);
} catch (e) { report('nested', 'error:' + e.name); }

// Code of the page's own that runs during an insertion, before the call returns.
var f2 = document.createElement('iframe');
f2.onload = function () { check('syncLoad', frames[frames.length - 1]); };
document.body.appendChild(f2);

customElements.define('probe-x', class extends HTMLElement {
  connectedCallback() { check('customElement', frames[frames.length - 1]); }
});
var box = document.createElement('div');
box.appendChild(document.createElement('iframe'));
box.appendChild(document.createElement('probe-x'));
document.body.appendChild(box);

var editable = document.createElement('div');
editable.contentEditable = 'true';
document.body.appendChild(editable);
editable.focus();
var before = frames.length;
try { document.execCommand('insertHTML', false, '<iframe></iframe>'); } catch (e) { report('execCommand', 'error:' + e.name); }
if (frames.length > before) check('execCommand', frames[frames.length - 1]); else report('execCommand', 'made no frame');

// A frame sent to about:blank, and one with a document of its own.
var f3 = document.createElement('iframe');
document.body.appendChild(f3);
var i3 = frames.length - 1;
f3.src = 'about:blank';
f3.addEventListener('load', function () { check('aboutBlank.load', frames[i3]); });

var f4 = document.createElement('iframe');
f4.srcdoc = '<script>parent.postMessage("srcdoc " + typeof RTCPeerConnection, "*")<\/script>';
document.body.appendChild(f4);

var opened = null;
try { opened = window.open('about:blank'); } catch (e) { report('open', 'error:' + e.name); }
if (opened) check('open', opened); else report('open', 'no window');

// What an anti-bot check may look at: natives a script has replaced.
function looksNative(label, f, name, length) {
  var text = Function.prototype.toString.call(f);
  var constructs = true;
  try { new f(); } catch (e) { constructs = false; }
  var ok = /\[native code\]/.test(text) && f.name === name && f.length === length && !('prototype' in f) && !constructs;
  if (!ok) unnatural.push(label + ' ' + JSON.stringify({ text: text.slice(0, 60), name: f.name, length: f.length, prototype: 'prototype' in f, constructs: constructs }));
}
looksNative('appendChild', Node.prototype.appendChild, 'appendChild', 1);
looksNative('insertAdjacentHTML', Element.prototype.insertAdjacentHTML, 'insertAdjacentHTML', 2);
looksNative('write', Document.prototype.write, 'write', 0);
looksNative('execCommand', Document.prototype.execCommand, 'execCommand', 1);
looksNative('define', CustomElementRegistry.prototype.define, 'define', 2);
looksNative('open', window.open, 'open', 0);
looksNative('toString', Function.prototype.toString, 'toString', 0);
looksNative('contentWindow', Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, 'contentWindow').get, 'get contentWindow', 0);
looksNative('innerHTML', Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML').set, 'set innerHTML', 1);
[[Node.prototype, 'appendChild', true], [window, 'open', true], [Function.prototype, 'toString', false], [CustomElementRegistry.prototype, 'define', true]].forEach(function (c) {
  var d = Object.getOwnPropertyDescriptor(c[0], c[1]);
  if (!d.writable || d.enumerable !== c[2] || !d.configurable) unnatural.push(c[1] + ' attributes ' + JSON.stringify(d));
});

setTimeout(function () {
  report('SUMMARY leaks', leaks.length ? leaks.join(',') : 'none');
  report('SUMMARY natives', unnatural.length ? 'NOT ' + unnatural.join('; ') : 'ok');
}, 5000);
</script>
</body></html>
