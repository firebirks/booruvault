<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>WebRTC probe</title></head><body>
<!--
  Looks for RTCPeerConnection wherever a page can reach a new frame, and tries each one it finds:
  a host candidate, gathered with no server at all, proves a peer connection works there. With a
  STUN server it would tell the server the phone's own address, around any proxy. Each finding is
  one line, "PROBE <name> <result>", and the last two say what was found:
  "PROBE SUMMARY leaks <names|none>" and "PROBE SUMMARY natives <ok|NOT ...>".
-->
<script>
var leaks = [];
var unnatural = [];
function report(name, value) { console.log('PROBE ' + name + ' ' + value); }
function check(name, w) {
  var t;
  try { t = typeof w.RTCPeerConnection; } catch (e) { report(name, 'error:' + e.name); return; }
  report(name, t);
  if (t !== 'function') return;
  try {
    var pc = new w.RTCPeerConnection({ iceServers: [] });
    pc.createDataChannel('probe');
    pc.onicecandidate = function (e) {
      if (e.candidate && leaks.indexOf(name) < 0) { leaks.push(name); report(name + '.LEAK', e.candidate.candidate.split(' ').slice(4, 8).join(' ')); }
    };
    pc.createOffer().then(function (o) { return pc.setLocalDescription(o); });
  } catch (e) { report(name + '.construct', 'error:' + e.name); }
}
window.addEventListener('message', function (e) { report('msg', e.data); });
check('top', window);
</script>

// A frame sent to about:blank, and one with a document of its own.
var f3 = document.createElement('iframe');
document.body.appendChild(f3);
var i3 = frames.length - 1;
f3.src = 'about:blank';
f3.addEventListener('load', function () { check('aboutBlank.load', frames[i3]); });

f4.srcdoc = '<script>parent.postMessage("srcdoc " + typeof RTCPeerConnection, "*")<\/script>';

// What an anti-bot check may look at: natives a script has replaced.
function looksNative(label, f, name, length) {
  var text = Function.prototype.toString.call(f);
  var constructs = true;
  try { new f(); } catch (e) { constructs = false; }
  var ok = /\[native code\]/.test(text) && f.name === name && f.length === length && !('prototype' in f) && !constructs;
  if (!ok) unnatural.push(label + ' ' + JSON.stringify({ text: text.slice(0, 60), name: f.name, length: f.length, prototype: 'prototype' in f, constructs: constructs }));

looksNative('insertAdjacentHTML', Element.prototype.insertAdjacentHTML, 'insertAdjacentHTML', 2);
looksNative('write', Document.prototype.write, 'write', 0);
looksNative('execCommand', Document.prototype.execCommand, 'execCommand', 1);
looksNative('define', CustomElementRegistry.prototype.define, 'define', 2);

looksNative('toString', Function.prototype.toString, 'toString', 0);

[[Node.prototype, 'appendChild', true], [window, 'open', true], [Function.prototype, 'toString', false], [CustomElementRegistry.prototype, 'define', true]].forEach(function (c) {
  var d = Object.getOwnPropertyDescriptor(c[0], c[1]);
  if (!d.writable || d.enumerable !== c[2] || !d.configurable) unnatural.push(c[1] + ' attributes ' + JSON.stringify(d));

// Called once the queued tests at the end of the page are over.
function summary() {
  setTimeout(function () {
    report('SUMMARY leaks', leaks.length ? leaks.join(',') : 'none');
    report('SUMMARY natives', unnatural.length ? 'NOT ' + unnatural.join('; ') : 'ok');
  }, 5000);
}
</script>

<!-- A frame and a script inserted together: the script runs inside the insertion, before it
     returns. Each frame's src is a local listener that never answers, so the frame stays on its
     first, empty document and has no load of its own to give it away; a site would use a slow
     server of its own. -->

var hangUrl = 'http://127.0.0.1:' + (new URLSearchParams(location.search || location.hash.slice(1)).get('port') || '9') + '/hang';
// One document.write: the script it writes runs inside the write.
document.write('<iframe src="' + hangUrl + '"></iframe><script>check("writeInline", frames[frames.length - 1]);<\/script>');
</script>
<script>
// One fragment: the script runs inside appendChild.
var frag = document.createDocumentFragment();
var fa = document.createElement('iframe');
fa.src = hangUrl;
var sa = document.createElement('script');
sa.textContent = 'check("fragmentScript", frames[frames.length - 1]);';
frag.appendChild(fa);
frag.appendChild(sa);
document.body.appendChild(frag);
</script>
<script>

// which keeps the frame's first document.

  var fb = document.createElement('iframe');
  var n0 = frames.length;
  sr.append(fb);
  if (frames.length > n0) check('shadowAppend', frames[frames.length - 1]);
  if (typeof document.body.moveBefore === 'function') {
    document.body.moveBefore(fb, null);
    check('shadowMove', frames[frames.length - 1]);
  } else report('shadowMove', 'no moveBefore');
