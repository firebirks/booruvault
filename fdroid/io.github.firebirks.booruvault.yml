# The metadata the project's own F-Droid repository is made with (see the Release workflow), and
# the reference copy of what F-Droid's own repository would need in fdroiddata, as
# metadata/io.github.firebirks.booruvault.yml.
#
# From the first release with GeckoView on, a release has an APK for each ABI, each with a version
# code of its own: the release's code with a digit after it, 1 for armeabi-v7a and 2 for arm64-v8a
# (app/build.gradle.kts). CurrentVersionCode is then the higher of the two published, so that a
# client suggests each phone the newest APK it can take. The build entry below is the last
# release with one APK for all; a recipe for F-Droid's own build of the later ones is open, as the
# engine comes prebuilt from Mozilla's Maven repository.
Categories:
  - Internet
  - Multimedia
License: GPL-3.0-or-later
AuthorName: firebirks
SourceCode: https://github.com/firebirks/booruvault
IssueTracker: https://github.com/firebirks/booruvault/issues
Changelog: https://github.com/firebirks/booruvault/releases

AutoName: BooruVault

# No anti-feature for adult content: the boards offered by name are safe ones, and only general
# posts are shown until the user turns other ratings on, behind an adult's confirmation. Any other
# board is added from its address, as a browser opens any site.

