name: Build

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to the commit of the release named beside each, and fdroidserver to its
# version: a tag can be moved to other code, a commit cannot.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Gradle's cache comes from setup-java: from v6 on, setup-gradle keeps its cache in a
      # proprietary component, so only the wrapper check is taken from gradle/actions.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build, lint and run unit tests
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest
      - name: Build the release APK (unsigned, as F-Droid builds it)
        run: ./gradlew assembleRelease
      - name: Keep the APKs
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest
