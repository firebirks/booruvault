# Every v* tag becomes a GitHub release carrying the APKs signed with the project's own key, one
# for each ABI published, for Obtainium and for direct installs. The browsers' engine is inside
# them, some 95 MB for each ABI.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Actions are pinned to the commit of the release named beside each, and fdroidserver to its
# version: a tag can be moved to other code, a commit cannot.
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Gradle's cache comes from setup-java: from v6 on, setup-gradle keeps its cache in a
      # proprietary component, so only the wrapper check is taken from gradle/actions.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # No Gradle cache: the build that gets the signing key takes nothing from earlier runs, which
      # a tag's run may restore from the default branch, task outputs included.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - name: Check that the tag names the version being built
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match versionName $name" >&2
            exit 1
          fi
          test -s "fastlane/metadata/android/en-US/changelogs/$code.txt"
          # F-Droid clients recommend the version the recipe names: the arm64-v8a APK's code,
          # the release's with a 2 after it. Named lower, no client would offer the update.
          recipe=fdroid/io.github.firebirks.booruvault.yml
          if [ "$(sed -n 's/^CurrentVersion: //p' "$recipe")" != "$name" ] || \
             [ "$(sed -n 's/^CurrentVersionCode: //p' "$recipe")" != "${code}2" ]; then
            echo "$recipe must name CurrentVersion $name and CurrentVersionCode ${code}2" >&2
            exit 1
          fi
          if git grep -nE 'TEMPORARY DEBUG|BVDebug' -- app; then
            echo "temporary debugging left in the app" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Install the SDK platform the engine asks to be compiled against
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null
      - name: Put the signing key where the build reads it
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=booruvault
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Test and build the signed release APKs
        run: ./gradlew --no-build-cache testDebugUnitTest assembleRelease
      - name: Remove the signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
      # arm64-v8a and armeabi-v7a are published. The x86_64 APK is built too, for emulators, and
      # stays here: a release would carry 100 MB more for phones that do not exist.
      - name: Name the APKs and write their checksums
        run: |
          mkdir dist
          total=0
          for abi in arm64-v8a armeabi-v7a; do
            apk="booruvault-${{ steps.version.outputs.name }}-$abi.apk"
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/$apk"
            (cd dist && sha256sum "$apk" > "$apk.sha256")
            total=$((total + $(stat -c %s "dist/$apk")))
          done
          # GitHub Pages serves no site over 1 GB: past it the F-Droid job's deployment fails after
          # the release is out, and the two would part with nobody told. Stop here instead.
          if [ "$total" -gt $((900 * 1024 * 1024)) ]; then
            echo "the APKs come to $total bytes, too near the 1 GB GitHub Pages takes for a site" >&2
            exit 1
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "BooruVault ${{ steps.version.outputs.name }}" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt"

  # The same APKs, served from the project's own F-Droid repository on GitHub Pages. The index
  # is signed with the repository key held in the secrets, and the repository carries the latest
  # release alone. The site, the page in site/ with the repository under fdroid/repo, goes to
  # Pages as an artifact this job deploys, not as a branch: an APK is some 95 MB, and a branch
  # would put every release's in the history of the code's own repository, and so in every clone.
  # Pages takes a deployment only from a ref its environment allows: the github-pages
  # environment's rules name the v* tags.
  fdroid:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install fdroidserver
        run: pip install fdroidserver==2.4.5
      - name: Lay out the repository working directory
        env:
          GH_TOKEN: ${{ github.token }}
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
        run: |
          mkdir -p work/metadata/io.github.firebirks.booruvault work/repo
          gh release download "$GITHUB_REF_NAME" --pattern '*.apk' --dir work/repo
          cp fdroid/io.github.firebirks.booruvault.yml work/metadata/
          cp -r fastlane/metadata/android/en-US work/metadata/io.github.firebirks.booruvault/
          # Each ABI's APK has a version code of its own, the release's with a digit after it
          # (see app/build.gradle.kts), and F-Droid looks for a changelog under each.
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          for digit in 1 2; do
            cp "fastlane/metadata/android/en-US/changelogs/$code.txt" \
              "work/metadata/io.github.firebirks.booruvault/en-US/changelogs/$code$digit.txt"
          done
          cp fastlane/metadata/android/en-US/images/icon.png work/icon.png
          echo "$FDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fdroid.p12"
          cat > work/config.yml <<EOF
          repo_url: https://firebirks.github.io/booruvault/fdroid/repo
          repo_name: BooruVault
          repo_icon: icon.png
          repo_description: >-
            The official repository of BooruVault, signed by its developer. It carries the
            same APKs as the GitHub release, built and signed by the release workflow.
          archive_older: 0
          repo_keyalias: booruvault-repo
          keystore: $RUNNER_TEMP/fdroid.p12
          keystorepass: $FDROID_KEYSTORE_PASS
          keypass: $FDROID_KEY_PASS
          keydname: CN=booruvault-repo, OU=F-Droid
          EOF
      - name: Update the repository index
        run: cd work && fdroid update
      - name: Remove the repository key
        if: always()
        run: rm -f work/config.yml "$RUNNER_TEMP/fdroid.p12"
      - name: Lay out the site
        run: |
          mkdir -p _site/fdroid
          cp -r site/. _site/
          rsync -a --exclude status work/repo/ _site/fdroid/repo/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
